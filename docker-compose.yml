services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: shopwise-postgres
    environment:
      POSTGRES_USER: shopwise
      POSTGRES_PASSWORD: shopwise
      POSTGRES_DB: shopwise
    ports:
      - '5433:5432'
    volumes:
      - shopwise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopwise']
      interval: 5s
      retries: 10

volumes:
  shopwise-pgdata:
